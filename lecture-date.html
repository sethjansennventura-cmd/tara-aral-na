<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lecture Subjects</title>

<link rel="stylesheet" href="css/style.css">


<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
</head>

<body>

<header>

<h2 id="lectureDateTitle"></h2>

</header>

<main>

<h3>Select Subject</h3>

<div class="subject-card"
onclick="openLectureSubject('Values')">

<h3>📖 Values</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('Araling Panlipunan')">

<h3>🌍 Araling Panlipunan</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('Mathematics')">

<h3>➗ Mathematics</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('ICT')">

<h3>💻 ICT</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('Filipino')">

<h3>🇵🇭 Filipino</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('MAPEH')">

<h3>🎵 MAPEH</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('English')">

<h3>📘 English</h3>

</div>

<div class="subject-card"
onclick="openLectureSubject('Science')">

<h3>🔬 Science</h3>

</div>

</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/toast.js"></script>
<script src="js/pull-refresh.js"></script>
<script src="js/dark-mode.js"></script>
<div id="toastContainer"></div>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", function () {

navigator.serviceWorker.register("service-worker.js")

.then(function () {

console.log("Service Worker registered.");

})

.catch(function (error) {

console.log("Service Worker failed:", error);

});

});

}

</script>

<script>

const date = localStorage.getItem("selectedLectureDate");

document.getElementById("lectureDateTitle").innerHTML =
"📖 " + date;

function openLectureSubject(subject){

    window.location.href =
    "lecture-subject.html?subject=" +
    encodeURIComponent(subject);

}

</script>

</body>

</html>
