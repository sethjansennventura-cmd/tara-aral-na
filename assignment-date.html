<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Assignments</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

</head>

<body>

<header>

<h2 id="dateTitle"></h2>

</header>

<main>

<h3>📚 Select Subject</h3>

<div class="subject-card" onclick="openSubject('Values')">
    <span>📖 Values</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('Araling Panlipunan')">
    <span>🌍 Araling Panlipunan</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('Mathematics')">
    <span>➗ Mathematics</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('ICT')">
    <span>💻 ICT</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('Filipino')">
    <span>🇵🇭 Filipino</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('MAPEH')">
    <span>🎵 MAPEH</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('English')">
    <span>📘 English</span>
    <span class="arrow">›</span>
</div>

<div class="subject-card" onclick="openSubject('Science')">
    <span>🔬 Science</span>
    <span class="arrow">›</span>
</div>

</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/toast.js"></script>
<script src="js/pull-refresh.js"></script>
<script src="js/dark-mode.js"></script>


<div id="toastContainer"></div>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", function () {

navigator.serviceWorker.register("service-worker.js")

.then(function () {

console.log("Service Worker registered.");

})

.catch(function (error) {

console.log("Service Worker failed:", error);

});

});

}

</script>

<script>

let date = localStorage.getItem("selectedDate");

document.getElementById("dateTitle").innerHTML =
"📂 " + date;

function openSubject(subject){

    window.location.href =
    "subject.html?subject=" +
    encodeURIComponent(subject);

}

</script>

</body>

</html>
