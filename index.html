<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Tara Aral Na!</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="login-page">

<div id="splash">

    <div class="splash-content">

        <div class="splash-logo">

            <img
                src="icon-512.png"
                alt="Tara Aral Na!"
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    display:block;
                ">

        </div>

        <h1>Tara Aral Na!</h1>

        <p>Learn. Share. Succeed.</p>

        <small class="splash-version">
            Version 1.0.0 • Genesis
        </small>

        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>

<div class="background">

<div class="floating one">📚</div>

<div class="floating two">✏️</div>

<div class="floating three">🎓</div>

<div class="floating four">💻</div>

<div class="floating five">🧪</div>

<div class="floating six">📖</div>

</div>

<div class="overlay"></div>

<div class="login-container">

<div class="login-card">

<div class="logo">

🎓

</div>

<h1>Tara Aral Na!</h1>

<p class="subtitle">

Learning made easier<br>

for students and teachers

</p>

<div class="password-box">

<input
type="password"
id="accessCode"
placeholder="Access Code">

<div
id="eyeIcon"
class="eye-btn"
onclick="togglePassword()">

👁️

</div>

</div>

<button
class="login-btn"
onclick="login()">

Continue →

</button>

<p class="author">

Created by <strong>Seth Jansenn</strong><br>

<span>Tara Aral Na! © 2026</span>

</p>

<p id="message"></p>

</div>

</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/ripple.js"></script>
<script src="js/toast.js"></script>

<div id="toastContainer"></div>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", function () {

navigator.serviceWorker.register("service-worker.js")

.then(function () {

console.log("Service Worker registered.");

})

.catch(function (error) {

console.log("Service Worker failed:", error);

});

});

}

</script>

<script>

function togglePassword(){

    const input =
    document.getElementById("accessCode");

    const eye =
    document.getElementById("eyeIcon");

    if(input.type==="password"){

        input.type="text";

        eye.innerHTML="🙈";

    }else{

        input.type="password";

        eye.innerHTML="👁️";

    }

}

</script>

<script>

window.addEventListener("load", function () {

    const splash = document.getElementById("splash");

    if (!splash) return;

    setTimeout(function () {

        splash.classList.add("hidden");

        setTimeout(function () {

            splash.remove();

        }, 700);

    }, 2200);

});

</script>

</body>

</html>
