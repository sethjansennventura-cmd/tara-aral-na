<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Lecture Subject</title>

<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

<h2 id="subjectTitle"></h2>

</header>

<main>

<button
class="add-main teacher-only"
onclick="openPopup()">

➕ Add File

</button>

<input
type="text"
id="searchInput"
placeholder="🔍 Search files..."
onkeyup="searchFiles()">

<select id="sortSelect" onchange="sortFiles()">

  <option value="newest">🆕 Newest</option>
  
  <option value="oldest">📜 Oldest</option>
  
  <option value="az">🔤 A–Z</option>
  
  <option value="za">🔡 Z–A</option>
  
  <option value="type">📄 File Type</option>
  
</select>

<h3>Files</h3>

<div id="fileList">
  
  <div class="skeleton-card">
    
    <div class="skeleton skeleton-title"></div>
    
    <div class="skeleton skeleton-line"></div>
    
    <div class="skeleton skeleton-line short"></div>
    
  </div>
  
  <div class="skeleton-card">
    
    <div class="skeleton skeleton-title"></div>
    
    <div class="skeleton skeleton-line"></div>
    
    <div class="skeleton skeleton-line short"></div>
    
  </div>
  
  <div class="skeleton-card">
    
    <div class="skeleton skeleton-title"></div>
    
    <div class="skeleton skeleton-line"></div>
    
    <div class="skeleton skeleton-line short"></div>
    
  </div>
  
</div>

</main>

<div id="uploadPopup" class="popup">

<div class="popup-box">

<h2>Upload Lecture</h2>

<input
type="text"
id="fileTitle"
placeholder="Enter lecture title">

<select id="fileType">

<option>File</option>

<option>Image</option>

<option>Video</option>

</select>

<input
type="file"
id="fileInput">

<button onclick="uploadLecture()">

Upload

</button>

<button onclick="closePopup()">

Cancel

</button>

</div>

</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>

<script src="js/api/supabase-api.js"></script>

<script src="js/file-utils.js"></script>
<script src="js/file-manager.js"></script>
<script src="js/favorites.js"></script>
<script src="js/recent-viewed.js"></script>
<script src="js/file-upload.js"></script>
<script src="js/lecture-files.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/app.js"></script>
<script src="js/ripple.js"></script>
<script src="js/toast.js"></script>
<script src="js/pull-refresh.js"></script>

<div id="toastContainer"></div>

<script>

if ("serviceWorker" in navigator) {

window.addEventListener("load", function () {

navigator.serviceWorker.register("service-worker.js")

.then(function () {

console.log("Service Worker registered.");

})

.catch(function (error) {

console.log("Service Worker failed:", error);

});

});

}

</script>

<script>

(async function(){

    const params =
    new URLSearchParams(window.location.search);

    const subject =
    params.get("subject");

    document.getElementById("subjectTitle").innerHTML =
    "📖 " + subject;

    await loadFavorites();

    loadLectureFiles();

})();

</script>

</body>

</html>
