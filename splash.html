<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tara Aral Na!</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#2563EB,#22C55E);

overflow:hidden;

}

.container{

text-align:center;
color:white;

animation:fadeIn 1s;

}

.logo{

width:140px;
height:140px;

border-radius:28px;

background:white;

display:flex;
justify-content:center;
align-items:center;

margin:auto;

box-shadow:0 15px 35px rgba(0,0,0,.25);

animation:pop .8s;

}

.logo img{

width:100px;

}

h1{

margin-top:25px;

font-size:34px;

font-weight:700;

}

p{

margin-top:8px;

font-size:18px;

opacity:.95;

}

small{

display:block;

margin-top:45px;

font-size:13px;

opacity:.8;

}

@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}

@keyframes pop{

0%{

transform:scale(.5);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="icon-512.png">

</div>

<h1>Tara Aral Na!</h1>

<p>Learn. Share. Succeed.</p>

<small>

Version 1.0.0 • Genesis

</small>

</div>

<script>

setTimeout(()=>{

window.location.href="index.html";

},2500);

</script>

</body>
</html>
